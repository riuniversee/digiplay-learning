<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Portal Pembelajaran Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo">
            <svg width="48" height="48" viewBox="0 0 64 64" fill="none">
                <rect x="14" y="10" width="24" height="32" rx="3" fill="#4ADE80"/>
                <rect x="20" y="16" width="24" height="32" rx="3" fill="#F87171"/>
                <rect x="26" y="22" width="24" height="32" rx="3" fill="#3B82F6"/>
                <rect x="35" y="29" width="10" height="4" rx="1" fill="#DBEAFE"/>
            </svg>
        </div>
        <h1 class="login-title">DigiPlay Learning</h1>
        <p class="login-subtitle">Silakan masuk untuk mengakses fasilitas animasi 3D dan melacak progres belajar</p>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda..." required>
            </div>

            <div class="form-group">
                <label for="nim">Absen</label>
                <input type="text" id="nim" placeholder="Contoh: 01" required>
            </div>

            <div class="form-group">
                <label for="role">Masuk Sebagai</label>
                <select id="role">
                    <option value="Siswa">Siswa / Peserta Didik</option>
                    <option value="Guru">Guru / Pengajar (Mode Kelola Materi)</option>
                </select>
            </div>

            <button type="submit" class="btn-primary btn-block">Masuk ke Portal →</button>
        </form>

        <div class="quick-login">
            <span>Akses Cepat Demo:</span>
            <button type="button" class="btn-outline" onclick="quickLogin('Guru')">Demo Guru</button>
            <button type="button" class="btn-outline" onclick="quickLogin('Pengembang')">Demo Pengembang</button>
        </div>
    </div>

    <script>
        if (localStorage.getItem('userSession')) {
            window.location.href = 'dashboard.html';
        }

        function handleLogin(e) {
            e.preventDefault();
            const nama = document.getElementById('nama').value.trim();
            const nim = document.getElementById('nim').value.trim();
            const role = document.getElementById('role').value;

            const session = { nama, nim, role };
            localStorage.setItem('userSession', JSON.stringify(session));
            window.location.href = 'dashboard.html';
        }

        function quickLogin(tipeDemo) {
            let session;
            if (tipeDemo === 'Guru') {
                session = { nama: 'Guru', nim: 'NIP. 19880520', role: 'Guru' };
            } else {
                session = { nama: 'Pengembang', nim: 'DEV-2026-01', role: 'Pengembang' };
            }
            localStorage.setItem('userSession', JSON.stringify(session));
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
